<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
<title id="title">NG SmartPark logo</title><desc id="desc">Nithin Gowda's SmartPark monogram with a crown, parking sign and glowing road.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10275A"/><stop offset="1" stop-color="#071123"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38E5FF"/><stop offset=".5" stop-color="#7C5CFF"/><stop offset="1" stop-color="#FFC857"/></linearGradient>
  <linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#B7E9FF"/></linearGradient>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFD56A"/><stop offset="1" stop-color="#FF9F43"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="11" y="11" width="234" height="234" rx="58" fill="url(#bg)" stroke="url(#edge)" stroke-width="5"/>
<path d="M75 40 L89 56 L111 33 L132 57 L151 38 L160 69 L72 69 Z" fill="url(#g)" stroke="#FFE7A0" stroke-width="2" stroke-linejoin="round"/>
<circle cx="75" cy="37" r="5" fill="#FFF2C7"/><circle cx="111" cy="30" r="5" fill="#FFF2C7"/><circle cx="151" cy="35" r="5" fill="#FFF2C7"/>
<text x="104" y="151" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="94" font-weight="900" fill="url(#n)" letter-spacing="-10">N</text>
<text x="164" y="151" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="87" font-weight="900" fill="url(#g)">G</text>
<rect x="174" y="81" width="42" height="54" rx="10" fill="#0B8FF8" stroke="#8CEAFF" stroke-width="2"/>
<text x="195" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="900" fill="#FFFFFF">P</text>
<path d="M41 183 H92 Q110 183 119 169 T146 155 H211" fill="none" stroke="#42E7FF" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
<path d="M47 200 H88" fill="none" stroke="#8B72FF" stroke-width="5" stroke-linecap="round"/>
<circle cx="210" cy="155" r="5" fill="#FFD56A" filter="url(#glow)"/>
</svg>